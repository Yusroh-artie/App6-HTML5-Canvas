Brief Description of Goal of Code:
This code demonstrates how to use an HTML5 canvas to draw shapes, text,
and images using JavaScript.
THE APP DISPLAYS
1. A canvas with a visible border
2. A button to draw a rectangle
3. A button to display a name
4. A button to load an image
5. A button to clear the canvas

   <head>
    <title>App6---HTML5-Canvas</title>

    <!--For  proper scaling on mobile devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- W3CSS styling -->
    <link rel="stylesheet" href="w3.css">
    <link rel="stylesheet" href="w3-colors-flat.css">

    <style>
        /* Remove default spacing */
        body {
            margin: 0em;
        }

        /* Canvas styling 
		- Center it horizontally
        - Give it a border so users can see its boundaries
        - Set background to white for visibility
        - Limit width so it fits on mobile screens*/
        #myAppCanvas {
            display: block;
            margin-left: auto;
            margin-right: auto;
            border: 2px solid black;
            background-color: white;
            max-width: 95%;
        }

        /*         Centers all buttons under the canvas and adds spacing
 */
        .button-container {
            text-align: center;
            margin-top: 10px;
        }
    </style>

    <script>
        /*
        ============================================================================
        This section runs when the page fully loads.
        We MUST wait for the DOM to load before accessing the canvas.
        ============================================================================
        */
        window.onload = function () {

// Final Check: Alert the user when the file was last modified
			var docMod = document.lastModified;
            alert("This file last modified " + docMod);
            console.log("This file last modified " + docMod);

            // Get the canvas element from HTML
            canvas = document.getElementById("myAppCanvas");

            // Get drawing context (this is what actually draws on canvas)
            ctx = canvas.getContext("2d");
        };

        /*
        ============================================================================
        FUNCTION: drawRectangle
        PURPOSE: Draws a blue rectangle on the canvas
        ============================================================================
        */
        function drawRectangle() {

            // Set "fillStyle" which is the color used to fill shapes.
            ctx.fillStyle = "#2196F3"; // blue

            // Draw rectangle (x, y, width, height)
            ctx.fillRect(20, 20, 120, 70);
			console.log("Rectangle drawn at coordinates 20, 20.");
        }

        /*
        ============================================================================
        FUNCTION: drawMyName
        PURPOSE: Displays user's name on the canvas. Shows custom text onto the canvas area.
        ============================================================================
        */
        function drawMyName() {

            // Set font style and size
            ctx.font = "20px Times New Roman";

            // Set text color
            ctx.fillStyle = "red";

            // Draw text (text, x position, y position)
            ctx.fillText("Yusroh", 20, 150);
        }

        /*
        ============================================================================
        FUNCTION: loadMyImage
        PURPOSE: Loads and draws an image onto the canvas
        IMPORTANT: Image must fully load before drawing
        ============================================================================
        */
        function loadMyImage() {

            // Create new image object
            var myImg = new Image();

            // Set image source URL
            myImg.src = "https://img.freepik.com/free-vector/cute-rabbit-bite-carrot-cartoon-vector-icon-illustration-animal-nature-icon-concept-isolated-flat_138676-7366.jpg";

            // WImages take time to download. We must wait for the 'onload' 
    // event to trigger before we try to draw it, or the canvas will remain blank.
            myImg.onload = function () {

                // Draw image (image, x, y, width, height)
                ctx.drawImage(myImg, 150, 150, 100, 100);
				console.log("Image successfully loaded and drawn.");
            };
        }

        /*
        ============================================================================
        FUNCTION: clearAll
        PURPOSE: This function resets the canvas by erasing every pixel.
        ============================================================================
        */
        function clearAll() {

            // clearRect(x, y, width, height)
    // We start at the top-left (0,0) and wipe the area matching the canvas size.
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    console.log("Canvas cleared.");
        }

    </script>
</head>

<body>

    <!-- Header section -->
    <div class="w3-container w3-flat-carrot">
        <h1>App6---HTML5-Canvas</h1>
    </div>

    <!-- Main content -->
    <div class="w3-container">
        <p>Use the buttons below to interact with the canvas.</p>

        <!-- Canvas element -->
        <canvas id="myAppCanvas" width="300" height="300"></canvas>

        <!-- Buttons -->
        <div class="button-container">
            <button onclick="drawRectangle()" class="w3-button w3-blue w3-round">Draw Rectangle</button>
            <button onclick="drawMyName()" class="w3-button w3-green w3-round">Draw Name</button>
            <button onclick="loadMyImage()" class="w3-button w3-purple w3-round">Load Image</button>
            <button onclick="clearAll()" class="w3-button w3-grey w3-round">Reset</button>
        </div>

        <p><b>DISCLAIMER:</b> This app is for educational purposes only.</p>
    </div>

    <!-- Footer -->
    <footer class="w3-bottom w3-container w3-flat-carrot">
        <p>DIY Diagnostics • Freshman Research Initiative</p>
    </footer>
</body>
</html>
